# hash) and to the sha256 of the file at that revision; harness.Model downloads
# https://huggingface.co/<repo>/resolve/<revision>/<file> without credentials and refuses a file whose
# sha256 differs.
#
# The repositories are the ones of the upstream test presets in tools/server/tests/utils.py of llama.cpp v1.1.0.
